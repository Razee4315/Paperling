name: Test Build

# Manual TEST builds, for trying changes on a real machine without heating up
# a dev laptop and without cutting a release. Produces the Windows installers
# as run ARTIFACTS only: Actions tab -> Test Build -> Run workflow, then
# download the zip from the run page (collaborators only; nothing public, no
# tag, no version bump, no updater manifest — the in-app updater cannot see
# these builds). For a real release use release.yml.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        # Caching is an optimization — a flaky GitHub cache service must never
        # fail the build (mirrors ci.yml / release.yml).
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows bundles
        # createUpdaterArtifacts is on in tauri.conf.json, so the build needs
        # the signing key even though these artifacts never reach the updater.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bun run tauri build --target x86_64-pc-windows-msvc

      - name: Upload installers as run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paperling-windows-x64-test
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Verifies the release.yml macOS packaging (universal Apple Silicon + Intel
  # bundle) without cutting a release — issues #94 / #103. Produces the .dmg as
  # a run artifact only.
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust (with Intel cross-compile target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build universal macOS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bun run tauri build --target universal-apple-darwin

      - name: Upload macOS bundle as run artifact
        uses: actions/upload-artifact@v7
        with:
          name: paperling-macos-universal-test
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
