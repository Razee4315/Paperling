name: Android Release APK

# Builds the arm64 release APK and attaches it to an EXISTING GitHub
# release. Exists so the Android artifact can be built, fixed and
# re-shipped independently of the desktop Release matrix: desktop legs
# publish the release, then this workflow is dispatched with that
# version to hang the APK on it. Same recipe as android-build.yml, with
# two differences: the APK is signed with the cached release keystore
# (not the debug key), and the result goes onto the release instead of
# run artifacts.
#
# Inputs:
#   version — the release tag WITHOUT the v (e.g. "1.0.50"). The APK is
#   uploaded to the "v<version>" release as Paperling_<version>_aarch64.apk.
#
# Signature stability: the APK is signed with the release keystore from repo
# secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD), the same one
# release.yml uses, and its certificate is checked against the pinned
# fingerprint before upload (ANDR-SIGN-01/02). A missing secret fails the run
# instead of minting a new key.
#
# upload: false builds, signs and verifies the APK and keeps it as a run
# artifact without touching any release (a dry run before a real release).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v (e.g. 1.0.50)'
        required: true
        type: string
      upload:
        description: 'Attach the APK to the release (false = dry run: build, sign, verify only)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          key: aarch64-linux-android

      - name: Setup Java 17 (Android Gradle Plugin requirement)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Restore the release keystore from repo secrets (stable APK signature)
        # ANDR-SIGN-01: the keystore used to live only in an actions cache, and
        # GitHub evicts caches after 7 days unused. 1.0.50's key was lost that
        # way, so 1.0.51 had to change signature (existing installs cannot
        # update in place). It now comes from repo secrets, and a missing
        # secret FAILS the job: silently generating a new key would ship an
        # APK that no existing install can update to.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to sign with a new key (existing installs could not update)."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/paperling-release.p12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Locate the preinstalled Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR="$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No preinstalled Android NDK found under $SDK/ndk"
            exit 1
          fi
          echo "NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"

      - name: Generate app icons (all densities, incl. Android mipmaps)
        run: bun run tauri icon public/icon.svg --output .tauri-icons

      - name: Initialize the Android project
        run: bun run tauri android init

      - name: Copy launcher icons into the generated project
        run: |
          SRC=".tauri-icons/android"
          DEST="src-tauri/gen/android/app/src/main/res"
          cp -r "$SRC"/mipmap-* "$DEST"/
          if [ -d "$SRC/mipmap-anydpi-v26" ]; then
            mkdir -p "$DEST/mipmap-anydpi-v26"
            cp "$SRC"/mipmap-anydpi-v26/* "$DEST/mipmap-anydpi-v26"/
            if [ -f "$DEST/mipmap-anydpi-v26/ic_launcher.xml" ]; then
              cp "$DEST"/mipmap-anydpi-v26/ic_launcher.xml "$DEST/mipmap-anydpi-v26/ic_launcher_round.xml"
            fi
          fi
          if [ -f "$SRC/values/ic_launcher_background.xml" ]; then
            cp "$SRC"/values/ic_launcher_background.xml "$DEST"/values/
          fi

      - name: Patch release signing (keystore.properties support)
        run: node scripts/patch-android-release-signing.mjs src-tauri/gen/android/app/build.gradle.kts

      - name: Point signing at the release keystore
        # keystore.properties goes to the Gradle ROOT (src-tauri/gen/android),
        # which is where the injected signingConfig looks for it.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not set."
            exit 1
          fi
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=paperling
          keyPassword=$KEYSTORE_PASSWORD
          storeFile=$HOME/.android/paperling-release.p12
          storePassword=$KEYSTORE_PASSWORD
          storeType=pkcs12
          EOF

      - name: Patch "Open with Paperling" file handling + system-bar insets
        run: node scripts/patch-android-open-with.mjs src-tauri/gen/android

      - name: Build APK (release, aarch64)
        run: bun run tauri android build --target aarch64 --apk

      - name: Verify the signature, then upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          mkdir -p dist-apk
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::Build succeeded but no release APK was found"
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          # ANDR-SIGN-02: never publish an APK signed with any other key. The
          # expected value is the public certificate's SHA-256 (not a secret).
          EXPECTED="3ad2ec64ee2a6d395919732b45d34ff070aeadf7238ebf15b0835e52f1cb3737"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose "$APK" | head -5
          DIGEST="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $DIGEST, expected $EXPECTED. Not publishing."
            exit 1
          fi
          echo "APK signature verified: $DIGEST"
          cp "$APK" "dist-apk/Paperling_${VERSION}_aarch64.apk"
          if [ "$UPLOAD" = "false" ]; then
            echo "Dry run: signed and verified, not attached to any release."
            exit 0
          fi
          gh release upload "v${VERSION}" "dist-apk/Paperling_${VERSION}_aarch64.apk" --clobber
          echo "Attached dist-apk/Paperling_${VERSION}_aarch64.apk to v${VERSION}"

      - name: Keep the dry-run APK as a run artifact
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: paperling-android-release-dryrun
          path: dist-apk/*.apk
          retention-days: 14
