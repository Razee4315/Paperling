name: Test Website
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['docs/**', '.github/workflows/test-website.yml', '.github/workflows/deploy-docs.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run verify
      - uses: actions/upload-artifact@v7
        with:
          name: paperling-website-preview
          path: docs/dist
          retention-days: 14
          if-no-files-found: error
